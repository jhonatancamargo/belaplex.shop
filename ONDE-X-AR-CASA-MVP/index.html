<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ONDE X — Teste Câmera</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;color:#fff}
#camera{position:fixed;z-index:1;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#overlay{position:fixed;z-index:5;inset:0;pointer-events:none}
.top{position:absolute;top:12px;left:12px;background:#0b0d12dd;border:1px solid #444;border-radius:14px;padding:10px 13px;font-weight:950;font-size:20px}.top b{color:#ff5018}
.bottom{position:absolute;left:12px;right:12px;bottom:12px;background:#0b0d12e8;border:1px solid #444;border-radius:14px;padding:12px;text-align:center}
#start{position:fixed;z-index:20;inset:0;background:#08090d;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(460px,100%);text-align:center}.x{font-size:90px;font-weight:950;color:#ff5018}
button{width:100%;min-height:56px;border:0;border-radius:13px;background:#ff5018;color:#fff;font-size:17px;font-weight:950}
#error{display:none;margin-top:12px;padding:11px;background:#2b130e;border:1px solid #74311e;border-radius:11px;color:#ffd6c8;text-align:left;font-size:13px;line-height:1.4}
#debug{margin-top:12px;color:#aaa;font-size:12px;word-break:break-word}
</style>
</head>
<body>
<video id="camera" autoplay muted playsinline webkit-playsinline></video>

<div id="overlay">
 <div class="top">ONDE <b>X</b></div>
 <div class="bottom"><b id="state">CÂMERA ATIVA</b><br><span style="font-size:12px;color:#aaa">Se você está vendo o ambiente atrás desta interface, o teste passou.</span></div>
</div>

<div id="start">
 <div class="card">
  <div class="x">X</div>
  <h1>Teste da câmera</h1>
  <p style="color:#aaa">Esta versão não tem AR nem reconhecimento. Ela serve somente para confirmar a câmera do Safari.</p>
  <button id="open">📷 ABRIR CÂMERA</button>
  <div id="error"></div>
  <div id="debug"></div>
 </div>
</div>

<script>
const video=document.getElementById('camera');
const start=document.getElementById('start');
const error=document.getElementById('error');
const debug=document.getElementById('debug');
document.getElementById('open').addEventListener('click', async ()=>{
 error.style.display='none';
 debug.textContent='Solicitando câmera...';
 try{
   if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
     throw new Error('getUserMedia não está disponível neste navegador/contexto.');
   }
   const stream=await navigator.mediaDevices.getUserMedia({
     audio:false,
     video:{facingMode:'environment'}
   });
   video.srcObject=stream;
   video.muted=true;
   video.setAttribute('playsinline','');
   await video.play();
   debug.textContent='Vídeo iniciado: '+video.videoWidth+'x'+video.videoHeight;
   start.style.display='none';
 }catch(e){
   error.style.display='block';
   error.innerHTML='<b>A câmera não iniciou.</b><br>'+String(e.name||'Erro')+': '+String(e.message||e);
   debug.textContent='Protocolo: '+location.protocol+' | Navegador: '+navigator.userAgent;
 }
});
video.addEventListener('loadedmetadata',()=>{
 debug.textContent='Metadados da câmera: '+video.videoWidth+'x'+video.videoHeight;
});
video.addEventListener('playing',()=>{
 document.getElementById('state').textContent='✓ CÂMERA ATIVA';
});
</script>
</body></html>
