<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ONDE X AR — Teste de câmera</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050609;color:white;font-family:Arial,sans-serif}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#050609}
#stage{position:fixed;inset:0;pointer-events:none;perspective:900px}
#x3d{position:absolute;left:50%;top:50%;width:120px;height:120px;transform:translate(-50%,-50%);pointer-events:auto;display:none}
#x3d:before,#x3d:after{content:"";position:absolute;left:50%;top:50%;width:25px;height:130px;border-radius:12px;background:linear-gradient(#ff9829,#ff3615);box-shadow:0 0 24px #ff4b1988}
#x3d:before{transform:translate(-50%,-50%) rotate(45deg)}#x3d:after{transform:translate(-50%,-50%) rotate(-45deg)}
#top{position:fixed;z-index:20;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.logo,.modes{pointer-events:auto;background:#0c0e13df;border:1px solid #343842;border-radius:15px;padding:9px 12px}.logo{font-size:23px;font-weight:950}.logo b{color:#ff5018}.modes{display:flex;gap:6px}
button{min-height:43px;border:1px solid #3b404a;border-radius:11px;background:#181b22;color:#fff;padding:0 13px;font-weight:900;cursor:pointer}button.on,button.primary{background:#ff5018;border-color:#ff5018}
#panel{position:fixed;z-index:20;left:12px;bottom:12px;width:min(430px,calc(100% - 24px));background:#0c0e13e8;border:1px solid #343842;border-radius:17px;padding:12px}
.small{font-size:12px;color:#afb2ba}.status{font-weight:950;font-size:16px;margin-bottom:6px}.row{display:flex;gap:6px;margin-top:8px}.row button{flex:1}
label{font-size:11px;color:#bbb;display:block;margin-top:7px}input[type=range]{width:100%}
#start{position:fixed;z-index:100;inset:0;background:#07080b;display:flex;align-items:center;justify-content:center;padding:20px}
.startbox{width:min(470px,100%);text-align:center}.mark{font-size:86px;font-weight:950;color:#ff5018}.startbox h1{margin:0 0 8px;font-size:30px}.startbox p{color:#aeb1b8;line-height:1.45}.startbox button{width:100%;height:54px;font-size:17px}.error{margin-top:12px;background:#25120d;border:1px solid #71301e;border-radius:12px;padding:10px;text-align:left;display:none;color:#ffd4c6;font-size:13px}
#found{position:fixed;z-index:80;inset:0;background:#000d;display:none;align-items:center;justify-content:center}.foundbox{text-align:center}.foundbox .mark{font-size:110px}
@media(max-width:600px){#top{top:7px;left:7px;right:7px}.logo{font-size:19px}.logo,.modes{padding:7px}.modes button{padding:0 9px;min-height:40px}#panel{left:7px;bottom:7px;width:calc(100% - 14px)}}
</style></head><body>
<video id="cam" autoplay playsinline muted></video>
<div id="stage"><div id="x3d" aria-label="X virtual"></div></div>
<div id="top"><div class="logo">ONDE <b>X</b> <span style="font-size:10px;color:#aaa">AR V2</span></div><div class="modes"><button id="admin" class="on">ADMIN</button><button id="hunt">PROCURAR</button></div></div>
<div id="panel">
 <div id="status" class="status">📷 Câmera pronta</div>
 <div id="desc" class="small">No ADMIN, toque na imagem da câmera para colocar o X naquele ponto.</div>
 <div id="controls">
  <label>Tamanho <span id="sv">100%</span></label><input id="size" type="range" min="40" max="240" value="100">
  <label>Rotação <span id="rv">0°</span></label><input id="rot" type="range" min="-180" max="180" value="0">
  <div class="row"><button id="save" class="primary">💾 SALVAR X</button><button id="clear">REDEFINIR</button></div>
 </div>
</div>
<div id="start"><div class="startbox"><div class="mark">X</div><h1>Teste AR dentro de casa</h1><p>Primeiro precisamos liberar a câmera. Depois você poderá apontar o celular para um lugar, tocar na tela e esconder o X virtual.</p><button id="activate" class="primary">📷 ATIVAR CÂMERA</button><div id="err" class="error"></div><p class="small" id="protocol"></p></div></div>
<div id="found"><div class="foundbox"><div class="mark">X</div><h1>X ENCONTRADO!</h1><button id="back">CONTINUAR</button></div></div>
<script>
(()=>{
const $=x=>document.getElementById(x), video=$('cam'), x=$('x3d'), start=$('start'), err=$('err');
let mode='admin', cfg={left:50,top:50,size:100,rot:0}, stream=null;
try{cfg={...cfg,...JSON.parse(localStorage.getItem('ondex_ar_v2')||'{}')}}catch(e){}
function apply(){x.style.left=cfg.left+'%';x.style.top=cfg.top+'%';x.style.width=cfg.size*1.2+'px';x.style.height=cfg.size*1.2+'px';x.style.transform=`translate(-50%,-50%) rotate(${cfg.rot}deg)`;$('size').value=cfg.size;$('rot').value=cfg.rot;$('sv').textContent=cfg.size+'%';$('rv').textContent=cfg.rot+'°'}
apply();
$('protocol').textContent='Endereço atual: '+location.protocol+'//'+location.host;
$('activate').onclick=async()=>{
 err.style.display='none';
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){err.style.display='block';err.innerHTML='<b>A câmera foi bloqueada pelo navegador.</b><br>Abra esta página por HTTPS ou localhost. Se o endereço começar com file://, publique a pasta em seu domínio HTTPS.';return}
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  video.srcObject=stream;await video.play();start.style.display='none';
 }catch(e){err.style.display='block';err.innerHTML='<b>Não consegui abrir a câmera.</b><br>Verifique o ícone de câmera na barra de endereço e escolha Permitir. No celular, prefira Chrome/Android ou Safari/iPhone e use HTTPS.<br><br>Erro: '+(e.name||'desconhecido')}
};
$('stage').addEventListener('pointerdown',e=>{
 if(mode!=='admin'||start.style.display!=='none')return;
 if(e.target===x)return;
 cfg.left=e.clientX/innerWidth*100;cfg.top=e.clientY/innerHeight*100;x.style.display='block';apply();$('status').textContent='🟠 X POSICIONADO';$('desc').textContent='Ajuste tamanho/rotação e salve.';
});
$('size').oninput=e=>{cfg.size=+e.target.value;apply()};$('rot').oninput=e=>{cfg.rot=+e.target.value;apply()};
$('save').onclick=()=>{localStorage.setItem('ondex_ar_v2',JSON.stringify(cfg));x.style.display='block';$('status').textContent='✓ X SALVO';$('desc').textContent='Agora toque em PROCURAR e tente reencontrar o local.'};
$('clear').onclick=()=>{localStorage.removeItem('ondex_ar_v2');cfg={left:50,top:50,size:100,rot:0};x.style.display='none';apply()};
function setMode(m){mode=m;$('admin').classList.toggle('on',m==='admin');$('hunt').classList.toggle('on',m==='hunt');$('controls').style.display=m==='admin'?'block':'none';if(m==='hunt'){x.style.display='none';$('status').textContent='🔎 PROCURANDO X';$('desc').textContent='Mova a câmera. Neste teste V2, toque no ponto onde você acredita que o X foi escondido.'}else{x.style.display='block';$('status').textContent='ADMIN — POSICIONE O X';$('desc').textContent='Toque na imagem da câmera para posicionar.'}}
$('admin').onclick=()=>setMode('admin');$('hunt').onclick=()=>setMode('hunt');
$('stage').addEventListener('click',e=>{
 if(mode!=='hunt')return;
 const px=e.clientX/innerWidth*100,py=e.clientY/innerHeight*100;
 const d=Math.hypot(px-cfg.left,py-cfg.top);
 if(d<10){x.style.display='block';$('status').textContent='🔥 X DETECTADO';setTimeout(()=>$('found').style.display='flex',500)}
 else{$('status').textContent='❌ NADA AQUI';setTimeout(()=>{$('status').textContent='🔎 PROCURANDO X'},900)}
});
$('back').onclick=()=>{$('found').style.display='none';x.style.display='none'};
})();
</script></body></html>
